<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080f19"><meta name="description" content="Idea Compass：以預先計算的知識向量，探索 AI 教學系統的跨領域知識宇宙。"><title>Idea Compass — Knowledge Universe</title><style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#dfebf5;background:#080f19;--line:#24354a;--muted:#94a8bd;--panel:#111c2a;--teal:#20c8b4;--amber:#f5b54b;--violet:#a78bfa}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:3px}.app{min-height:100vh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;padding:15px 24px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}.brand{font-size:20px;font-weight:850;letter-spacing:-.8px}.brand i{font-style:normal;color:var(--teal)}.sub{font-size:11px;color:var(--muted);letter-spacing:.7px;margin-top:4px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #31435a;border-radius:9px;background:#18273a;color:#dceaf5;padding:9px 13px;font-size:12px;transition:.15s}.btn:hover{background:#253951;border-color:#49a9b0}.btn.primary{background:#0e9489;color:white;border-color:#0e9489;font-weight:700}.btn.primary:hover{background:#0b7e76}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(310px,.85fr);flex:1;min-height:640px}.workspace{min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}.side{min-width:0;padding:20px 22px;display:flex;flex-direction:column;gap:16px;background:#0d1723}.bar{padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}.crumb{display:flex;gap:5px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:11px}.crumb button{color:inherit;background:none;border:0;padding:3px}.crumb button:hover{color:var(--teal)}.info{font-size:11px;color:var(--muted)}.map{position:relative;flex:1;min-height:480px;overflow:hidden}.map svg{display:block;width:100%;height:100%;min-height:480px;touch-action:manipulation}.node{cursor:pointer}.node:hover .core{filter:brightness(1.5)}.node:focus-visible{outline:none}.node:focus-visible .halo{stroke:white;stroke-width:4}.rings{display:flex;gap:15px;flex-wrap:wrap;padding:13px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.bottom{border-top:1px solid var(--line);padding:15px 20px;background:#0c1724}.bottom-header{display:flex;justify-content:space-between;align-items:center;gap:8px}.selected{display:flex;gap:7px;flex-wrap:wrap;min-height:43px;margin-top:12px}.pill{background:#1a2c3e;border:1px solid #354b61;border-radius:7px;padding:6px 9px;font-size:12px;color:#dceaf5}.tabs{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;background:#172435;border:1px solid var(--line);border-radius:10px;gap:4px}.tabs button{border:0;background:transparent;color:var(--muted);padding:9px 2px;border-radius:7px;font-size:12px}.tabs button.active{background:#304158;color:white;font-weight:700}.kicker{font-size:10px;color:var(--teal);letter-spacing:1.7px;font-weight:800;text-transform:uppercase}.title{font-size:25px;font-weight:820;letter-spacing:-.7px;line-height:1.3;margin:8px 0}.muted{color:var(--muted);font-size:13px;line-height:1.85}.card{background:#142336;border:1px solid var(--line);border-radius:13px;padding:15px}.card-label{font-weight:750;font-size:12px;color:#e3f2fb;margin-bottom:8px}.card p{color:#c3d5e5;font-size:12px;line-height:1.8;margin:0}.topic-tag{display:inline-block;background:#243449;border-radius:5px;padding:5px 8px;color:#aec4d7;font-size:11px;margin:4px 5px 4px 0}.actions{display:flex;flex-wrap:wrap;gap:8px}.concept{padding:15px;border:1px solid var(--line);border-radius:12px;background:#112032;margin:12px 0}.concept h3{margin:7px 0;font-size:16px}.concept .part{font-size:12px;color:#bed0df;line-height:1.7;margin:7px 0}.concept .part strong{color:#f0f6fa}.code{white-space:pre-wrap;word-break:break-word;font-size:11px;background:#0a1420;border:1px solid var(--line);padding:13px;border-radius:9px;line-height:1.7;margin-top:10px;max-height:280px;overflow:auto}.search{padding:9px 12px;border:1px solid #35495e;border-radius:9px;color:#e4f1f9;background:#111f2f;width:200px;max-width:100%;font-size:12px}.search-results{position:absolute;right:0;top:40px;max-height:260px;overflow:auto;width:270px;background:#142336;border:1px solid #3e5368;z-index:10;border-radius:9px;box-shadow:0 10px 35px #0008}.search-results button{width:100%;text-align:left;display:block;color:#e7f2fa;padding:11px;border:0;background:transparent;border-bottom:1px solid #293a4d}.search-results button:hover{background:#263a51}.search-container{position:relative}.small{font-size:11px;color:var(--muted);line-height:1.7}.foot{padding:12px 23px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.notice{font-size:11px;color:#f6c77d;line-height:1.7}.question{padding:13px;border-left:3px solid var(--amber);background:#192431;font-size:12px;line-height:1.7}.progress{height:4px;border-radius:4px;background:#26364a;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--violet))}.modes{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.modes .btn{padding:6px 9px}.modes .chosen{border-color:var(--teal);color:var(--teal)}@media(max-width:850px){.layout{grid-template-columns:1fr}.workspace{border-right:0;border-bottom:1px solid var(--line)}.map{height:500px;flex:none}.side{min-height:420px}.top{padding:13px 15px}.bar{padding:12px}.foot{padding:12px}}@media(max-width:500px){.map,.map svg{min-height:390px;height:390px}.bar{align-items:flex-start}.brand{font-size:18px}.side{padding:16px}.controls .search{width:155px}.node text{font-size:12px}}
</style></head><body><div class="app"><header class="top"><div><div class="brand">◉ Idea <i>Compass</i> <span style="color:#718fa3;font-weight:450">/ Knowledge Universe</span></div><div class="sub">PRECOMPUTED VECTOR EXPLORATION · NO RUNTIME AI COST</div></div><div class="controls"><div class="search-container"><input id="search" class="search" placeholder="搜尋 70 個知識概念…" aria-label="搜尋知識概念" autocomplete="off"><div id="searchResults" class="search-results" hidden></div></div><button id="back" class="btn">← 返回</button><button id="reset" class="btn">↺ 重設</button></div></header>
<main class="layout"><section class="workspace"><div class="bar"><div class="crumb" id="crumb"></div><div class="modes"><span class="small" id="depth"></span><button id="more" class="btn" title="重新選取更遠距的候選知識">↗ 更遠一點</button></div></div><div id="map" class="map" aria-label="同心圓知識探索地圖"></div><div class="rings"><span><i class="legend-dot" style="background:var(--teal)"></i>Near</span><span><i class="legend-dot" style="background:var(--amber)"></i>Cross-domain</span><span><i class="legend-dot" style="background:var(--violet)"></i>Distant</span><span style="margin-left:auto">點擊查看 · 雙擊深入 · 可無限重新置中</span></div><div class="bottom"><div class="bottom-header"><b>✦ Idea Mixer <span id="selectedCount" class="small"></span></b><button id="clear" class="btn">清除選取</button></div><div id="selected" class="selected"></div><button id="combine" class="btn primary" style="width:100%">組合選取知識 → 產生創意方向</button></div></section><aside class="side"><nav id="tabs" class="tabs"><button class="active" data-tab="knowledge">知識探索</button><button data-tab="ideas">創意組合</button><button data-tab="history">探索歷程</button></nav><div id="panel"></div></aside></main><footer class="foot"><span id="modelInfo">載入離線向量資料中…</span><span>所有資料在瀏覽器運作 · 不使用 AI API · 可部署 GitHub Pages</span></footer></div>
<script>
(()=>{'use strict';let data,nodes,byId,similarity,center='ai',trail=['ai'],focused=null,selected=[],tab='knowledge',ideas=[],shift=0,visible=[];const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const idx=id=>nodes.findIndex(n=>n.id===id);const sim=(a,b)=>similarity[idx(a)][idx(b)];const colors=['','#20c8b4','#f5b54b','#a78bfa'];
function candidate(){const pool=nodes.filter(n=>n.id!==center).map(n=>({...n,score:sim(center,n.id)})).sort((a,b)=>b.score-a.score);const near=pool.slice(0,7), mid=pool.slice(7,26),far=pool.slice(26);const order=(arr,count,k)=>{const step=Math.max(1,Math.floor(arr.length/count));return Array.from({length:count},(_,i)=>arr[(i*step+k)%arr.length]).filter(Boolean)};return [{ring:1,items:near},{ring:2,items:order(mid,7,shift%mid.length)},{ring:3,items:order(far,7,(shift*3)%far.length)}]}
function map(){const W=800,H=670,cx=400,cy=335,radius=[0,121,221,293];const groups=candidate();const positions=[];groups.forEach(g=>g.items.forEach((n,i)=>{const ang=-Math.PI/2+Math.PI*2*i/g.items.length+(g.ring===2?.29:g.ring===3?.54:0);positions.push({...n,ring:g.ring,x:cx+radius[g.ring]*Math.cos(ang),y:cy+radius[g.ring]*Math.sin(ang)});}));visible=positions;let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="以${esc(byId[center].name)}為中心的知識地圖"><circle cx="${cx}" cy="${cy}" r="293" stroke="#a78bfa" stroke-dasharray="6 7" stroke-opacity=".40" fill="#a78bfa" fill-opacity=".014"/><circle cx="${cx}" cy="${cy}" r="221" stroke="#f5b54b" stroke-dasharray="6 7" stroke-opacity=".5" fill="none"/><circle cx="${cx}" cy="${cy}" r="121" stroke="#20c8b4" stroke-dasharray="6 7" stroke-opacity=".56" fill="none"/><text x="408" y="208" fill="#20c8b4" font-size="11">NEAR</text><text x="408" y="109" fill="#f5b54b" font-size="11">CROSS-DOMAIN</text><text x="408" y="38" fill="#a78bfa" font-size="11">DISTANT</text>`;
positions.forEach(n=>{let active=selected.includes(n.id)||n.id===focused;s+=`<path d="M${cx} ${cy}L${n.x} ${n.y}" stroke="${colors[n.ring]}" stroke-opacity="${active?.75:.16}" stroke-width="${active?2:1}"/>`});positions.forEach(n=>{const active=selected.includes(n.id)||n.id===focused,col=colors[n.ring],name=n.name.length>9?n.name.slice(0,9)+'…':n.name;const labelY=n.y+(n.y<cy-75?-18:22);s+=`<g class="node" role="button" tabindex="0" data-node="${n.id}" aria-label="${esc(n.name)}"><circle class="halo" cx="${n.x}" cy="${n.y}" r="${active?16:13}" fill="${col}" fill-opacity="${active?.24:.1}" stroke="${col}" stroke-opacity="${active?1:.40}" stroke-width="2"/><circle class="core" cx="${n.x}" cy="${n.y}" r="${active?8:6}" fill="${col}"/><text x="${n.x}" y="${labelY}" text-anchor="middle" font-size="12" fill="${active?'#ffffff':'#a8bed3'}" font-weight="${active?750:500}">${esc(name)}</text><text x="${n.x}" y="${labelY+12}" text-anchor="middle" font-size="9" fill="#758b9e">${n.ring===1?'':'sim '+n.score.toFixed(2)}</text>${selected.includes(n.id)?`<circle cx="${n.x+13}" cy="${n.y-13}" r="8" fill="#0c9188"/><text x="${n.x+13}" y="${n.y-10}" text-anchor="middle" font-size="11" fill="white">✓</text>`:''}</g>`});s+=`<circle cx="${cx}" cy="${cy}" r="59" fill="#2374b7" opacity=".16"/><circle cx="${cx}" cy="${cy}" r="53" fill="#1661a4" stroke="#65b7ec" stroke-opacity=".5"/><text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="${byId[center].name.length>8?12:15}" font-weight="800" fill="white">${esc(byId[center].name)}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="#bfddf6">EXPLORATION CENTER</text></svg>`;$('map').innerHTML=s;$('map').querySelectorAll('[data-node]').forEach(el=>{let id=el.dataset.node;el.addEventListener('click',()=>{focused=id;tab='knowledge';render()});el.addEventListener('dblclick',()=>navigate(id));el.addEventListener('keydown',e=>{if(e.key==='Enter'){focused=id;tab='knowledge';render()}if(e.key===' '){e.preventDefault();navigate(id)}})});}
function navigate(id){if(!byId[id])return;center=id;trail.push(id);focused=null;shift=0;tab='knowledge';render()};function choose(id){if(selected.includes(id))selected=selected.filter(x=>x!==id);else if(selected.length<4)selected.push(id);render()};function render(){map();$('depth').textContent='DEPTH '+(trail.length-1);$('crumb').innerHTML=trail.slice(-5).map((id,i)=>`<button data-go="${id}">${esc(byId[id].name)}</button>${i<Math.min(5,trail.length)-1?'›':''}`).join('');$('crumb').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const i=trail.lastIndexOf(b.dataset.go);trail=trail.slice(0,i+1);center=b.dataset.go;focused=null;tab='knowledge';render()});$('selectedCount').textContent=`${selected.length}/4`;$('selected').innerHTML=selected.length?selected.map(id=>`<button class="pill" data-remove="${id}">${esc(byId[id].name)} ×</button>`).join(''):'<span class="small">選取至少兩個知識節點。點擊節點後可加入創意組合。</span>';$('selected').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>choose(b.dataset.remove));$('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='knowledge')knowledge();else if(tab==='ideas')ideaPanel();else history()}
function knowledge(){const id=focused||center,n=byId[id],score=sim(center,id);$('panel').innerHTML=`<div class="kicker">${id===center?'CURRENT CENTER':'EXPLORE KNOWLEDGE'}</div><h1 class="title">${esc(n.name)}</h1><span class="topic-tag">${esc(n.domain)}</span>${id!==center?`<span class="topic-tag">Cosine similarity ${(score).toFixed(3)}</span>`:''}<p class="muted">${esc(n.description)}</p><div class="card"><div class="card-label">⚙ 核心運作機制</div><p>${esc(n.mechanism)}</p></div><div class="card"><div class="card-label">✦ 如果移植到 AI 教學系統？</div><p>${esc(n.id==='ai'?'探索教育、控制、統計、網路與生物等領域，設計一個能診斷、調整、評估的個人化教學系統。':`將「${n.mechanism}」當作跨域類比假說，轉化為可觀察的教學策略，再透過學習成果驗證。`)}</p></div><div class="question">研究問題：${esc(n.name)} 能否和另一個領域的機制互補，解決 AI 教學系統中的一個具體問題？</div><div class="actions"><button class="btn primary" id="add">${selected.includes(id)?'✓ 從組合移除':'＋ 加入創意組合'}</button>${id!==center?'<button class="btn" id="dive">◎ 設為中心 · Deep Dive</button>':''}</div><div><div class="kicker" style="margin-bottom:8px">NEXT EXPLORATION CANDIDATES</div><div id="related">${nodes.filter(x=>x.id!==id).sort((a,b)=>sim(id,b.id)-sim(id,a.id)).slice(0,6).map(x=>`<button class="pill" data-rel="${x.id}" style="margin:3px">${esc(x.name)}</button>`).join('')}</div></div><p class="small">距離取自離線中文文字語料的 TF-IDF + SVD 混合餘弦相似度；不是 OpenAI Embedding，也不代表客觀知識距離。</p>`;$('add').onclick=()=>choose(id);if($('dive'))$('dive').onclick=()=>navigate(id);$('related').querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>{focused=b.dataset.rel;render()});}
const patterns=[['認知負荷 × 動態位元率','把學習者資訊負荷類比為通訊容量，按觀測訊號動態調節單次解釋的概念密度。','讓學生學習力學時先檢查理解，再按錯誤與自評調整解釋粒度。'],['貝氏知識追蹤 × 主動學習','用不確定性估計決定診斷問題，避免僅憑單次答題判斷是否掌握。','針對學生容易猜對的概念安排不同形式的遷移題。'],['免疫記憶 × 錯誤概念模型','把反覆出現的錯誤模式保存成可重用的診斷與矯正策略。','多次出現相同推理錯誤時，AI 主動切換對比案例。'],['控制理論 × 適性難度','用多次回饋調節教學難度，避免受到單次答錯而劇烈震盪。','連續觀察學生理解再提高難度，避免過度反應。'],['知識圖譜 × 探索迷霧','結合先備概念關係與漸進揭露，讓學習路線可以自主探索。','解鎖學習過的光學概念附近的攝影與視覺心理節點。']];
function createIdeas(){if(selected.length<2){tab='knowledge';focused=selected[0]||center;render();window.alert('請先選取至少兩個知識節點');return}const a=byId[selected[0]],b=byId[selected[1]];ideas=[{title:`${a.name} × ${b.name}`,desc:`結合「${a.name}」的機制和「${b.name}」的機制，建立新的 AI 教學策略。`,mechanism:`A：${a.mechanism}\nB：${b.mechanism}\n組合：在教學循環中同時使用兩種機制，定義可觀察訊號、調整規則與成效指標。`,scenario:'選定一個具體的學習困難，先評估基線，再測試合成策略是否改善理解與跨題遷移。'},...patterns.slice(0,2).map(([title,desc,scenario])=>({title,desc,mechanism:'透過跨領域類比提出可測試的教學設計，不直接推論教育效果。',scenario}))];tab='ideas';render()}
function prompt(r){return `你是一名 AI 教學系統設計師。\n請把以下跨域知識組合轉化成具體、可測試的教學互動。\n\n選取知識：${selected.map(id=>byId[id].name).join('、')}\n提案：${r.title}\n假說：${r.desc}\n機制：${r.mechanism}\n場景：${r.scenario}\n\n規則：\n1. 先詢問學習目標和先備知識。\n2. 以診斷問題收集可觀測證據。\n3. 解釋每次調整教材難度的理由。\n4. 讓學生可主動改變節奏。\n5. 不把類比當成已驗證的科學結論。\n6. 以理解、長期保留、遷移題設計驗證指標。\n7. 產出五輪完整教學模擬。`}
function ideaPanel(){if(!ideas.length){$('panel').innerHTML='<div class="kicker">CREATIVE SYNTHESIS</div><h2 class="title">Idea Mixer</h2><p class="muted">從地圖中選取兩至四個知識節點，透過預設的機制組合模板產生創意，複製 Prompt 到你自己的 AI 工具。這一步沒有外部 API 成本。</p><div class="card">✦ 從左側選取知識，點擊「組合選取知識」。</div>';return}$('panel').innerHTML=`<div class="kicker">PRECOMPUTED COMPOSITION · NO AI API</div><h2 class="title">Idea Mixer</h2><p class="muted">${selected.map(id=>esc(byId[id].name)).join(' × ')}</p>${ideas.map((r,i)=>`<article class="concept"><div class="kicker">IDEA ${i+1}</div><h3>${esc(r.title)}</h3><div class="part">${esc(r.desc)}</div><div class="part"><strong>運作機制：</strong>${esc(r.mechanism)}</div><div class="part"><strong>應用場景：</strong>${esc(r.scenario)}</div><button class="btn" data-expand="${i}">展開 AI Instructions ↓</button><div id="prompt-${i}" hidden><pre class="code">${esc(prompt(r))}</pre><button class="btn primary" data-copy="${i}">複製 Instructions</button></div></article>`).join('')}<p class="small">創意範本為探索用途；類比不等於教育效益已獲得驗證。</p>`;$('panel').querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{const e=$('prompt-'+b.dataset.expand);e.hidden=!e.hidden});$('panel').querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{let val=prompt(ideas[+b.dataset.copy]);try{await navigator.clipboard.writeText(val);b.textContent='✓ 已複製'}catch{const ta=document.createElement('textarea');ta.value=val;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();b.textContent='✓ 已複製'}})}
function history(){$('panel').innerHTML=`<div class="kicker">EXPLORATION PATH</div><h2 class="title">探索歷程</h2><p class="muted">每次點擊 Deep Dive 都會以新概念重新計算周圍的知識距離。你可以返回任何一個中心，從另一條路線繼續探索。</p>${trail.map((id,i)=>`<button class="card" data-history="${i}" style="width:100%;display:block;text-align:left;color:#e7f0f7;margin:8px 0;cursor:pointer"><span class="kicker">DEPTH ${i}</span><br><b>${esc(byId[id].name)}</b><br><span class="small">${esc(byId[id].domain)}</span></button>`).join('')}`;$('panel').querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{trail=trail.slice(0,Number(b.dataset.history)+1);center=trail.at(-1);focused=null;tab='knowledge';render()})}
$('back').onclick=()=>{if(trail.length>1){trail.pop();center=trail.at(-1);focused=null;tab='knowledge';render()}};$('reset').onclick=()=>{center='ai';trail=['ai'];focused=null;selected=[];ideas=[];shift=0;tab='knowledge';render()};$('clear').onclick=()=>{selected=[];ideas=[];render()};$('combine').onclick=createIdeas;$('more').onclick=()=>{shift++;map()};$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('search').addEventListener('input',e=>{let q=e.target.value.trim().toLowerCase();let results=q?nodes.filter(n=>[n.name,n.domain,n.description].some(x=>x.toLowerCase().includes(q))).slice(0,12):[];let box=$('searchResults');box.hidden=!results.length;box.innerHTML=results.map(n=>`<button data-search="${n.id}"><strong>${esc(n.name)}</strong><br><span class="small">${esc(n.domain)}</span></button>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{let id=b.dataset.search;box.hidden=true;$('search').value='';navigate(id)})});document.addEventListener('click',e=>{if(!e.target.closest('.search-container'))$('searchResults').hidden=true});
fetch('./data/knowledge.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{data=d;nodes=d.nodes;similarity=d.similarity;byId=Object.fromEntries(nodes.map(n=>[n.id,n]));$('modelInfo').textContent=`${nodes.length} concepts · ${d.metadata.algorithm} · precomputed offline`;render()}).catch(e=>{$('map').innerHTML=`<div style="padding:40px;color:#f8b9a8">無法讀取資料：${esc(e.message)}。請使用本機 HTTP server 或 GitHub Pages 開啟網站，勿直接用 file://。</div>`});
})();
</script></body></html>
